version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # ⚠️ Remove this in production
    environment:
      - DEBUG=False  # ⚠️ Must be False in production
      - SECRET_KEY=${SECRET_KEY}  # ⚠️ Use environment variable
    restart: unless-stopped  # Add this
    # stdin_open and tty not needed in production