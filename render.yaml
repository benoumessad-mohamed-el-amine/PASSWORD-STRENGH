services:
  - type: web
    name: password-checker
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn password_checker.wsgi:application --bind 0.0.0.0:8000
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11"
